<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400..700&display=swap" rel="stylesheet">
    <title>Mini Chat</title>
    <link rel="icon" type="image/x-icon" href="assets/icon.ico">
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <div class="bg-overlay"></div>

    <div class="sidebar">
        <p class="sidebar-title">Menu</p>
        <ul class="sidebar-menu">
            <li><a href="#" class="active">Chat</a></li>
            <li><a href="#">Settings</a></li>
        </ul>
        
        <p class="sidebar-section-title">Recent Chats</p>
        <ul class="history-menu" id="history-list">
        </ul>

        <button class="new-chat-btn" id="new-chat-btn">+ New Chat</button>
    </div>

    <div class="home">
        <p class="title">Mini Chat</p>

        <div class="chat-container" id="chat-container">
        </div>

        <div class="input-container">
            <input type="text" class="text-input" id="user-input" placeholder="Enter your question...">
            <button class="send-btn" id="send-btn">➔</button>
        </div>

        <div class="icon">
            <img src="assets/chat.png" class="logo">
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
